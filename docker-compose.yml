services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: capy
      POSTGRES_PASSWORD: capy
      POSTGRES_DB: capy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capy"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3737:3737"
    environment:
      PORT: 3737
      DATABASE_URL: postgres://capy:capy@db:5432/capy
      MAIL_GRAPH_URL: http://mail-mock:4010/v1.0
      MAIL_GRAPH_TOKEN: ${MAIL_MOCK_TOKEN:-dev-mail-token}
      SHAREPOINT_GRAPH_URL: http://sharepoint-mock:4020/v1.0
      SHAREPOINT_GRAPH_TOKEN: ${SHAREPOINT_MOCK_TOKEN:-dev-sp-token}
      SEED_DIR: /app/seed
      CAPY_DEV_PERSONAS: "true"
    volumes:
      - ./mocks/seed:/app/seed:ro
    depends_on:
      db:
        condition: service_healthy
      mail-mock:
        condition: service_started
      sharepoint-mock:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5178:80"
    depends_on:
      - backend

  mail-mock:
    build:
      context: ./mocks
      dockerfile: mail/Dockerfile
    ports:
      - "4010:4010"
    environment:
      PORT: 4010
      MAIL_MOCK_TOKEN: ${MAIL_MOCK_TOKEN:-dev-mail-token}
      MAIL_MOCK_ADMIN_TOKEN: ${MAIL_MOCK_ADMIN_TOKEN:-dev-mail-admin-token}

  sharepoint-mock:
    build:
      context: ./mocks
      dockerfile: sharepoint/Dockerfile
    ports:
      - "4020:4020"
    environment:
      PORT: 4020
      SHAREPOINT_MOCK_TOKEN: ${SHAREPOINT_MOCK_TOKEN:-dev-sp-token}
      SHAREPOINT_MOCK_ADMIN_TOKEN: ${SHAREPOINT_MOCK_ADMIN_TOKEN:-dev-sp-admin-token}

volumes:
  pgdata:
